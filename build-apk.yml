name: Build APK

# Builds the installable app and attaches it to a Release, so there is a
# permanent link you can open on your phone.
#
# IMPORTANT: this file only works when it lives at
#   .github/workflows/build-apk.yml
# GitHub ignores workflow files anywhere else. A copy at the repository root
# is inert.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The project may sit at the repository root or nested a few folders
      # down, depending on how the zip was unpacked before uploading.
      # Rather than hardcode a path that silently breaks, find the marker
      # file and derive everything from it.
      - name: Locate the project
        id: find
        run: |
          MARKER=$(find . -name sync_android.sh -not -path './.git/*' | head -1)
          if [ -z "$MARKER" ]; then
            echo "::error::Could not find sync_android.sh anywhere in the repo."
            echo "Files at the root:"; ls -la
            exit 1
          fi
          DIR=$(dirname "$MARKER")
          echo "dir=$DIR"          >> "$GITHUB_OUTPUT"
          echo "android=$DIR/android" >> "$GITHUB_OUTPUT"
          echo "Project found at: $DIR"
          if [ ! -f "$DIR/android/settings.gradle.kts" ]; then
            echo "::error::$DIR/android/settings.gradle.kts is missing — the upload is incomplete."
            exit 1
          fi

      # BOOTSTRAP — remove once these are committed to the repo.
      #
      # The manifest referenced @mipmap/ic_launcher while res/ contained no
      # icon at all, which fails resource linking on every build. Doing it
      # here avoids hand-creating nested folders in a web editor. Both
      # halves are idempotent: once the real files are committed this step
      # finds nothing to do and prints "already correct".
      - name: Ensure the launcher icon exists
        working-directory: ${{ steps.find.outputs.android }}/app/src/main
        run: |
          set -e
          changed=0
          mkdir -p res/drawable
          if [ ! -f res/drawable/ic_launcher_foreground.xml ]; then
            cat > res/drawable/ic_launcher_foreground.xml <<'ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#120C24" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#8B7BFF" android:pathData="M54,10a44,44 0 1,0 0.1,0z" />
              <path android:fillColor="#5C4BC4" android:pathData="M54,18a36,36 0 1,0 0.1,0z" />
              <path android:fillColor="#120C24" android:pathData="M54,41a13,13 0 1,0 0.1,0z" />
              <path android:strokeColor="#EFEBFF" android:strokeWidth="3"
                  android:strokeAlpha="0.7" android:fillColor="#00000000"
                  android:pathData="M28,34 A33,33 0 0,1 62,20" />
          </vector>
          ICON
            sed -i 's/^          //' res/drawable/ic_launcher_foreground.xml
            echo "created res/drawable/ic_launcher_foreground.xml"
            changed=1
          fi
          if grep -q '@mipmap/ic_launcher' AndroidManifest.xml; then
            sed -i 's|@mipmap/ic_launcher_round|@drawable/ic_launcher_foreground|g' AndroidManifest.xml
            sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher_foreground|g' AndroidManifest.xml
            echo "repointed the manifest icon away from the missing mipmap"
            changed=1
          fi
          [ "$changed" = "0" ] && echo "already correct — nothing to do"
          echo "--- icon reference now:"
          grep -n 'android:icon' AndroidManifest.xml || true

      # AGP 8.7 requires JDK 17. The runner ships several; pin it.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The pipeline lives in two places; this copies it into the APK bundle
      # and fails if a non-stdlib import has crept in, which would need a pip
      # block in Gradle and a wheel that exists for Android.
      - name: Sync pipeline into the app bundle
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x sync_android.sh
          ./sync_android.sh

      # Catches a broken pipeline here rather than after you have installed it.
      - name: Run the test suites
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          for f in test_corpus.py test_adversarial.py test_comps.py test_economics.py; do
            echo "--- $f"
            python3 "$f"
          done

      # `gradle-version` is load-bearing: without it this action only sets
      # up caching for a wrapper that is expected to already exist, and
      # leaves no `gradle` on the PATH. AGP 8.7 needs Gradle 8.9+.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Print the toolchain before building. When a build fails on someone
      # else's machine, the first question is always which versions were
      # actually in play.
      - name: Toolchain versions
        run: |
          echo "java:   $(java -version 2>&1 | head -1)"
          echo "gradle: $(gradle --version | grep -i '^Gradle' | head -1)"
          echo "sdk:    ${ANDROID_HOME:-unset}"
          echo "ndk:    $(ls "${ANDROID_HOME}/ndk" 2>/dev/null | tr '\n' ' ' || echo none)"

      # Invoked directly rather than through a wrapper. Generating one first
      # was an extra failure point that bought nothing in CI, where the
      # Gradle version is already pinned by the step above.
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.android }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Name the output
        id: name
        run: echo "stamp=$(date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      # Available from the Actions run page. Artifacts expire after 90 days
      # and require being signed in, which is awkward on a phone — hence the
      # Release below.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spine-apk-${{ steps.name.outputs.stamp }}
          path: ${{ steps.find.outputs.android }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.name.outputs.stamp }}
          name: Spine ${{ steps.name.outputs.stamp }}
          body: |
            Debug build. Open this page on your phone and tap the `.apk`
            below to install. Android will ask once whether to allow
            installs from your browser.

            Prices are synthetic until a real comp source is configured —
            the app shows a banner while that is the case.
          files: ${{ steps.find.outputs.android }}/app/build/outputs/apk/debug/app-debug.apk
